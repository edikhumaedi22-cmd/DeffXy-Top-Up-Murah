<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠️ DEVICE KILLER - Stress Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #0f0;
  }

  #warning {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,0,0,0.8);
    color: white;
    padding: 8px 16px;
    border-radius: 5px;
    z-index: 9999;
    font-size: 12px;
    animation: blink 0.5s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  #canvas1 { z-index: 1; }
  #canvas2 { z-index: 2; mix-blend-mode: screen; }
  #canvas3 { z-index: 3; mix-blend-mode: lighten; }

  .dom-storm {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
  }

  .dom-element {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    animation: crazySpin 0.3s linear infinite, 
               crazyMove 2s ease-in-out infinite alternate,
               crazyScale 0.5s ease-in-out infinite alternate,
               crazyColor 0.1s linear infinite;
    filter: blur(1px) drop-shadow(0 0 10px currentColor);
  }

  @keyframes crazySpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes crazyMove {
    0% { margin-left: 0; margin-top: 0; }
    100% { margin-left: 100px; margin-top: 100px; }
  }

  @keyframes crazyScale {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(3) rotate(720deg); }
  }

  @keyframes crazyColor {
    0% { color: #ff0000; background: #ff0000; }
    25% { color: #00ff00; background: #00ff00; }
    50% { color: #0000ff; background: #0000ff; }
    75% { color: #ffff00; background: #ffff00; }
    100% { color: #ff00ff; background: #ff00ff; }
  }

  .matrix-rain {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
    font-size: 14px;
    line-height: 14px;
    color: #0f0;
    text-shadow: 0 0 5px #0f0;
    overflow: hidden;
    opacity: 0.7;
  }

  .glitch-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 6;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.1) 0px,
      rgba(0,0,0,0.1) 1px,
      transparent 1px,
      transparent 3px
    );
    animation: glitchShift 0.1s infinite;
  }

  @keyframes glitchShift {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, 2px); }
    100% { transform: translate(1px, -2px); }
  }

  #stats {
    position: fixed;
    bottom: 10px;
    left: 10px;
    background: rgba(0,0,0,0.8);
    color: #0f0;
    padding: 10px;
    border: 1px solid #0f0;
    border-radius: 5px;
    z-index: 9999;
    font-size: 11px;
    min-width: 200px;
  }

  #controls {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: rgba(0,0,0,0.8);
    color: #0f0;
    padding: 10px;
    border: 1px solid #f00;
    border-radius: 5px;
    z-index: 9999;
    font-size: 11px;
  }

  button {
    background: #300;
    color: #f00;
    border: 1px solid #f00;
    padding: 5px 10px;
    margin: 2px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
  }

  button:hover {
    background: #f00;
    color: #000;
  }

  .heavy-filter {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 7;
    pointer-events: none;
    backdrop-filter: blur(0.5px) saturate(200%) hue-rotate(0deg);
    animation: filterCrazy 2s linear infinite;
  }

  @keyframes filterCrazy {
    0% { backdrop-filter: blur(0.5px) saturate(200%) hue-rotate(0deg); }
    25% { backdrop-filter: blur(1px) saturate(300%) hue-rotate(90deg); }
    50% { backdrop-filter: blur(0.5px) saturate(400%) hue-rotate(180deg); }
    75% { backdrop-filter: blur(1.5px) saturate(300%) hue-rotate(270deg); }
    100% { backdrop-filter: blur(0.5px) saturate(200%) hue-rotate(360deg); }
  }
</style>
</head>
<body>

<div id="warning">⚠️ STRESS TEST - HP BISA CRASH! ⚠️</div>

<canvas id="canvas1"></canvas>
<canvas id="canvas2"></canvas>
<canvas id="canvas3"></canvas>

<div class="dom-storm" id="domStorm"></div>
<div class="matrix-rain" id="matrixRain"></div>
<div class="glitch-overlay"></div>
<div class="heavy-filter"></div>

<div id="stats">
  <div>FPS: <span id="fps">0</span></div>
  <div>Particles: <span id="particleCount">0</span></div>
  <div>DOM Elements: <span id="domCount">0</span></div>
  <div>Memory: <span id="memUsage">N/A</span></div>
  <div>Intensity: <span id="intensity">1</span>x</div>
</div>

<div id="controls">
  <div style="margin-bottom:5px; color:#f00;">⚡ KONTROL BENCANA ⚡</div>
  <button onclick="addMoreParticles()">+ Particles</button>
  <button onclick="addMoreDOM()">+ DOM Elements</button>
  <button onclick="maxChaos()">☠️ MAX CHAOS</button>
  <button onclick="resetAll()">🔄 Reset</button>
</div>

<!-- TOMBOL BARU DI TENGAH -->
<button onclick="alert('slamet'); this.innerText='slamet'; this.style.background='#0f0'; this.style.color='#000'; this.style.borderColor='#0f0';" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10000; padding: 20px 40px; font-size: 24px; font-weight: bold; background: #ff0000; color: #ffffff; border: 3px solid #ffffff; border-radius: 10px; cursor: pointer; font-family: 'Courier New', monospace; box-shadow: 0 0 30px rgba(255, 0, 0, 0.8); animation: blink 0.5s infinite;">
  TEKAN AKU
</button>

<script>
// ============ CONFIGURATION ============
let CONFIG = {
  particleCount: 2000,
  domElements: 500,
  matrixColumns: 100,
  intensity: 1,
  running: true
};

// ============ CANVAS PARTICLE SYSTEM ============
const canvases = [
  document.getElementById('canvas1'),
  document.getElementById('canvas2'),
  document.getElementById('canvas3')
];

const contexts = canvases.map(c => c.getContext('2d'));

function resizeCanvases() {
  canvases.forEach(c => {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  });
}
resizeCanvases();
window.addEventListener('resize', resizeCanvases);

class Particle {
  constructor(canvas) {
    this.canvas = canvas;
    this.reset();
  }

  reset() {
    this.x = Math.random() * this.canvas.width;
    this.y = Math.random() * this.canvas.height;
    this.vx = (Math.random() - 0.5) * 8 * CONFIG.intensity;
    this.vy = (Math.random() - 0.5) * 8 * CONFIG.intensity;
    this.size = Math.random() * 5 + 1;
    this.hue = Math.random() * 360;
    this.life = Math.random() * 100 + 50;
    this.maxLife = this.life;
    this.trail = [];
    this.trailLength = Math.floor(Math.random() * 15) + 5;
  }

  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.trailLength) this.trail.shift();

    this.x += this.vx;
    this.y += this.vy;
    this.vx += (Math.random() - 0.5) * 0.5 * CONFIG.intensity;
    this.vy += (Math.random() - 0.5) * 0.5 * CONFIG.intensity;
    this.hue += 3 * CONFIG.intensity;
    this.life--;

    // Bounce
    if (this.x < 0 || this.x > this.canvas.width) this.vx *= -1;
    if (this.y < 0 || this.y > this.canvas.height) this.vy *= -1;

    if (this.life <= 0) this.reset();
  }

  draw(ctx) {
    // Draw trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const alpha = (i / this.trail.length) * (this.life / this.maxLife);
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.size * (i / this.trail.length), 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue + i * 5}, 100%, 50%, ${alpha})`;
      ctx.fill();
    }

    // Draw particle
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.life / this.maxLife})`;
    ctx.shadowBlur = 20;
    ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, 0.8)`;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

let particles = [];

function initParticles(count) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(canvases[i % 3]));
  }
}

function drawConnections(ctx, particles) {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < Math.min(particles.length, i + 20); j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 100) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `hsla(${particles[i].hue}, 100%, 50%, ${1 - dist / 100})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

// ============ DOM STORM ============
const domStorm = document.getElementById('domStorm');

function createDOMElement() {
  const el = document.createElement('div');
  el.className = 'dom-element';
  el.style.left = Math.random() * 100 + '%';
  el.style.top = Math.random() * 100 + '%';
  el.style.animationDuration = `${Math.random() * 0.5 + 0.1}s, ${Math.random() * 3 + 0.5}s, ${Math.random() * 0.3 + 0.1}s, ${Math.random() * 0.2 + 0.05}s`;
  el.style.animationDelay = `${Math.random() * -5}s`;
  domStorm.appendChild(el);
  return el;
}

function addDOMStorm(count) {
  for (let i = 0; i < count; i++) {
    createDOMElement();
  }
}

// ============ MATRIX RAIN ============
const matrixRain = document.getElementById('matrixRain');
const matrixChars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF';

function createMatrixColumn() {
  const col = document.createElement('div');
  col.style.cssText = `
    position: absolute;
    left: ${Math.random() * 100}%;
    top: -100%;
    animation: matrixFall ${Math.random() * 3 + 1}s linear infinite;
    animation-delay: ${Math.random() * -5}s;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: ${Math.random() * 10 + 10}px;
    color: hsl(${Math.random() * 60 + 90}, 100%, 50%);
    text-shadow: 0 0 10px currentColor;
  `;
  
  let text = '';
  const length = Math.floor(Math.random() * 30) + 10;
  for (let i = 0; i < length; i++) {
    text += matrixChars[Math.floor(Math.random() * matrixChars.length)];
  }
  col.textContent = text;
  matrixRain.appendChild(col);
}

// Add matrix fall animation
const matrixStyle = document.createElement('style');
matrixStyle.textContent = `
  @keyframes matrixFall {
    0% { top: -100%; }
    100% { top: 100%; }
  }
`;
document.head.appendChild(matrixStyle);

function initMatrix() {
  for (let i = 0; i < CONFIG.matrixColumns; i++) {
    createMatrixColumn();
  }
}

// ============ MEMORY LEAK SIMULATOR ============
let leakedArrays = [];

function leakMemory() {
  // Create large arrays that never get garbage collected
  const arr = new Array(10000).fill(null).map(() => ({
    data: new Float64Array(1000),
    nested: { more: new Array(100).fill(Math.random()) }
  }));
  leakedArrays.push(arr);
}

// ============ FPS COUNTER ============
let frameCount = 0;
let lastTime = performance.now();
let fps = 0;

function updateFPS() {
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastTime = now;
    
    document.getElementById('fps').textContent = fps;
    document.getElementById('fps').style.color = 
      fps > 30 ? '#0f0' : fps > 15 ? '#ff0' : '#f00';
    
    document.getElementById('particleCount').textContent = particles.length;
    document.getElementById('domCount').textContent = domStorm.children.length;
    
    if (performance.memory) {
      const mb = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
      document.getElementById('memUsage').textContent = mb + ' MB';
    }
    
    document.getElementById('intensity').textContent = CONFIG.intensity;
  }
}

// ============ MAIN LOOP ============
function animate() {
  if (!CONFIG.running) return;

  // Clear canvases with fade effect
  contexts.forEach(ctx => {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  });

  // Update and draw particles
  particles.forEach(p => {
    p.update();
    const ctxIndex = canvases.indexOf(p.canvas);
    p.draw(contexts[ctxIndex]);
  });

  // Draw connections on first canvas
  drawConnections(contexts[0], particles.slice(0, 200));

  // Add extra chaos - random explosions
  if (Math.random() < 0.1 * CONFIG.intensity) {
    const ctx = contexts[Math.floor(Math.random() * 3)];
    const x = Math.random() * ctx.canvas.width;
    const y = Math.random() * ctx.canvas.height;
    const radius = Math.random() * 100 + 50;
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
    gradient.addColorStop(0, `hsla(${Math.random() * 360}, 100%, 50%, 0.8)`);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
  }

  // Memory leak every few frames
  if (frameCount % 60 === 0) {
    leakMemory();
  }

  updateFPS();
  requestAnimationFrame(animate);
}

// ============ CONTROLS ============
function addMoreParticles() {
  CONFIG.intensity += 0.5;
  initParticles(1000);
}

function addMoreDOM() {
  CONFIG.intensity += 0.5;
  addDOMStorm(200);
  for (let i = 0; i < 20; i++) createMatrixColumn();
}

function maxChaos() {
  CONFIG.intensity = 5;
  initParticles(5000);
  addDOMStorm(1000);
  for (let i = 0; i < 200; i++) createMatrixColumn();
  
  // Extra heavy: nested animations
  for (let i = 0; i < 50; i++) {
    const el = document.createElement('div');
    el.style.cssText = `
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: ${Math.random() * 5 + 1}px solid hsla(${Math.random()*360}, 100%, 50%, 0.5);
      border-radius: ${Math.random() * 50}%;
      animation: crazySpin ${Math.random() * 0.5 + 0.1}s linear infinite;
      pointer-events: none;
      z-index: ${10 + i};
      mix-blend-mode: difference;
    `;
    document.body.appendChild(el);
  }
}

function resetAll() {
  CONFIG.running = false;
  setTimeout(() => {
    location.reload();
  }, 100);
}

// ============ INIT ============
initParticles(CONFIG.particleCount);
addDOMStorm(CONFIG.domElements);
initMatrix();
animate();

// Auto-escalate intensity
setInterval(() => {
  if (CONFIG.running) {
    CONFIG.intensity += 0.1;
    if (Math.random() < 0.3) {
      initParticles(100);
    }
    if (Math.random() < 0.2) {
      addDOMStorm(10);
    }
  }
}, 3000);

console.log('%c⚠️ DEVICE STRESS TEST ACTIVE ⚠️', 'color: red; font-size: 20px; font-weight: bold;');
console.log('%cClose this tab if your device starts overheating!', 'color: yellow; font-size: 14px;');
</script>

</body>
</html>
