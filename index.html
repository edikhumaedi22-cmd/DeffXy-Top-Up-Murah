<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>🀄 Mahjong Fortune Slot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: radial-gradient(circle, #3a0a0a 0%, #1a0505 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffd700;
    overflow: hidden;
  }
  .machine {
    background: linear-gradient(145deg, #8b0000, #4a0000);
    border: 6px solid #ffd700;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 0 60px rgba(255, 215, 0, 0.4), inset 0 0 30px rgba(0,0,0,0.5);
    width: 620px;
  }
  .title {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 2px 2px 4px #000, 0 0 15px #ff6b00;
    margin-bottom: 15px;
    letter-spacing: 2px;
  }
  .title .dragon { font-size: 38px; }
  .info-bar {
    display: flex;
    justify-content: space-between;
    background: #1a0505;
    border: 2px solid #ffd700;
    border-radius: 10px;
    padding: 10px 15px;
    margin-bottom: 15px;
    font-size: 14px;
  }
  .info-bar div { text-align: center; flex: 1; }
  .info-bar .label { color: #ff9500; font-size: 11px; display: block; }
  .info-bar .value { color: #ffd700; font-size: 18px; font-weight: bold; }
  .reels-container {
    background: #000;
    border: 4px solid #ffd700;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    position: relative;
    overflow: hidden;
  }
  .reels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .reel {
    background: linear-gradient(180deg, #2a0a0a, #1a0505, #2a0a0a);
    border: 2px solid #8b0000;
    border-radius: 8px;
    height: 300px;
    overflow: hidden;
    position: relative;
  }
  .reel-strip {
    display: flex;
    flex-direction: column;
    transition: transform 0.1s;
  }
  .symbol {
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    background: linear-gradient(180deg, #fff8dc, #ffe4b5);
    border-radius: 6px;
    margin: 0;
    position: relative;
    box-shadow: inset 0 0 10px rgba(139, 0, 0, 0.3);
  }
  .symbol.win {
    animation: winPulse 0.6s infinite alternate;
    box-shadow: 0 0 20px #ffd700, inset 0 0 10px rgba(255, 215, 0, 0.5);
  }
  @keyframes winPulse {
    from { transform: scale(1); background: linear-gradient(180deg, #fff8dc, #ffe4b5); }
    to { transform: scale(1.08); background: linear-gradient(180deg, #fffacd, #ffd700); }
  }
  .payline {
    position: absolute;
    left: 0; right: 0;
    height: 100px;
    border: 3px solid #ff0;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    animation: lineFlash 0.5s infinite alternate;
  }
  @keyframes lineFlash {
    from { opacity: 0.3; }
    to { opacity: 0.9; }
  }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .bet-control {
    background: #1a0505;
    border: 2px solid #ffd700;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bet-control button {
    background: #ffd700;
    color: #4a0000;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .bet-control button:hover { background: #ffed4e; transform: scale(1.1); }
  .bet-control .bet-value {
    color: #ffd700;
    font-size: 20px;
    font-weight: bold;
    min-width: 60px;
    text-align: center;
  }
  .spin-btn {
    background: linear-gradient(145deg, #ffd700, #ff8c00);
    color: #4a0000;
    border: 3px solid #fff;
    border-radius: 50%;
    width: 90px;
    height: 90px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    transition: all 0.2s;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }
  .spin-btn:hover:not(:disabled) {
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
  }
  .spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .message {
    text-align: center;
    min-height: 30px;
    font-size: 18px;
    margin-top: 12px;
    color: #ffd700;
    text-shadow: 0 0 10px #ff6b00;
    font-weight: bold;
  }
  .paytable {
    background: #1a0505;
    border: 2px solid #ffd700;
    border-radius: 10px;
    padding: 10px;
    margin-top: 15px;
    font-size: 12px;
  }
  .paytable h3 {
    text-align: center;
    color: #ffd700;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .paytable-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
  }
  .paytable-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 8px;
    background: rgba(255, 215, 0, 0.05);
    border-radius: 4px;
  }
  .paytable-row .sym { font-size: 18px; }
  .paytable-row .mult { color: #ff9500; font-weight: bold; }
  .coin-rain {
    position: fixed;
    pointer-events: none;
    font-size: 30px;
    animation: fall 2s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
<div class="machine">
  <div class="title">
    <span class="dragon">🐉</span> MAHJONG FORTUNE <span class="dragon">🐉</span>
  </div>

  <div class="info-bar">
    <div><span class="label">SALDO</span><span class="value" id="balance">1000</span></div>
    <div><span class="label">TARUHAN</span><span class="value" id="betDisplay">10</span></div>
    <div><span class="label">MENANG</span><span class="value" id="winDisplay">0</span></div>
  </div>

  <div class="reels-container">
    <div class="reels" id="reels"></div>
  </div>

  <div class="controls">
    <div class="bet-control">
      <button onclick="changeBet(-10)">−</button>
      <div>
        <div style="font-size:10px;color:#ff9500;">TARUHAN</div>
        <div class="bet-value" id="bet">10</div>
      </div>
      <button onclick="changeBet(10)">+</button>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN<br>🀄</button>
    <div class="bet-control">
      <button onclick="maxBet()">MAX</button>
      <div>
        <div style="font-size:10px;color:#ff9500;">GARIS</div>
        <div class="bet-value">5</div>
      </div>
    </div>
  </div>

  <div class="message" id="message">Tekan SPIN untuk mulai!</div>

  <div class="paytable">
    <h3>📜 TABEL PEMBAYARAN (x TARUHAN)</h3>
    <div class="paytable-grid" id="paytable"></div>
  </div>
</div>

<script>
  // Simbol Mahjong dengan nilai multiplier
  const SYMBOLS = [
    { icon: '🀄', name: 'Red Dragon', mult: 50, weight: 1 },
    { icon: '🐉', name: 'Dragon',     mult: 30, weight: 2 },
    { icon: '🏮', name: 'Lantern',    mult: 20, weight: 3 },
    { icon: '🎋', name: 'Bamboo',     mult: 15, weight: 4 },
    { icon: '🎎', name: 'Dolls',      mult: 10, weight: 5 },
    { icon: '🀅', name: 'Green',      mult: 8,  weight: 6 },
    { icon: '🀆', name: 'White',      mult: 5,  weight: 7 },
    { icon: '🀇', name: 'Char 1',     mult: 3,  weight: 8 },
    { icon: '🀙', name: 'Circle',     mult: 2,  weight: 9 }
  ];

  // Bangun strip reel berdasarkan weight
  const reelStrip = [];
  SYMBOLS.forEach(s => {
    for (let i = 0; i < s.weight; i++) reelStrip.push(s);
  });

  const ROWS = 3, COLS = 5;
  let balance = 1000, bet = 10, spinning = false;
  const grid = []; // grid[row][col] = symbol

  // =================================================================
  // SISTEM AUDIO (Ditambahkan - Tidak mengubah kode asli di bawah)
  // =================================================================
  let audioCtx;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSpinAudio() {
    if (!audioCtx) return;
    let count = 0;
    const maxTicks = 25;
    const tick = () => {
      if (!audioCtx || count >= maxTicks) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(150 + Math.random() * 100, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
      count++;
      setTimeout(tick, 70);
    };
    tick();
  }

  function playWinAudio() {
    if (!audioCtx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 (Chime)
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const startTime = audioCtx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.15, startTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.6);
    });
  }

  function playBigWinAudio() {
    if (!audioCtx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00]; // Arpeggio penuh
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const startTime = audioCtx.currentTime + i * 0.08;
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.8);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.9);
    });
  }
  // =================================================================

  // Inisialisasi reel display
  const reelsEl = document.getElementById('reels');
  for (let c = 0; c < COLS; c++) {
    const reel = document.createElement('div');
    reel.className = 'reel';
    const strip = document.createElement('div');
    strip.className = 'reel-strip';
    strip.id = `strip-${c}`;
    // Tampilkan 3 simbol awal
    for (let r = 0; r < ROWS; r++) {
      const sym = document.createElement('div');
      sym.className = 'symbol';
      sym.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)].icon;
      strip.appendChild(sym);
    }
    reel.appendChild(strip);
    reelsEl.appendChild(reel);
  }

  // Paytable
  const ptEl = document.getElementById('paytable');
  SYMBOLS.slice(0, 6).forEach(s => {
    const row = document.createElement('div');
    row.className = 'paytable-row';
    row.innerHTML = `<span class="sym">${s.icon} ${s.name}</span><span class="mult">x${s.mult}</span>`;
    ptEl.appendChild(row);
  });

  function changeBet(delta) {
    if (spinning) return;
    bet = Math.max(10, Math.min(500, bet + delta));
    document.getElementById('bet').textContent = bet;
    document.getElementById('betDisplay').textContent = bet;
  }
  function maxBet() {
    if (spinning) return;
    bet = Math.min(500, balance);
    bet = Math.floor(bet / 10) * 10;
    document.getElementById('bet').textContent = bet;
    document.getElementById('betDisplay').textContent = bet;
  }

  function randomSymbol() {
    return reelStrip[Math.floor(Math.random() * reelStrip.length)];
  }

  function spin() {
    if (spinning) return;
    if (balance < bet) {
      document.getElementById('message').textContent = '💸 Saldo tidak cukup!';
      return;
    }
    
    // Pemicu Audio
    initAudio();
    playSpinAudio();
    
    spinning = true;
    balance -= bet;
    updateBalance();
    document.getElementById('winDisplay').textContent = '0';
    document.getElementById('message').textContent = '🎰 Memutar...';
    document.getElementById('spinBtn').disabled = true;

    // Generate hasil
    const result = [];
    for (let c = 0; c < COLS; c++) {
      const col = [];
      for (let r = 0; r < ROWS; r++) col.push(randomSymbol());
      result.push(col);
    }

    // Animasi spin per reel
    for (let c = 0; c < COLS; c++) {
      animateReel(c, result[c], 800 + c * 300);
    }

    // Setelah semua berhenti, cek kemenangan
    setTimeout(() => {
      checkWins(result);
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
    }, 800 + COLS * 300 + 200);
  }

  function animateReel(colIndex, finalCol, duration) {
    const strip = document.getElementById(`strip-${colIndex}`);
    const startTime = Date.now();
    const spinSymbols = 20;

    function frame() {
      const elapsed = Date.now() - startTime;
      if (elapsed >= duration) {
        // Tampilkan hasil final
        strip.innerHTML = '';
        finalCol.forEach(sym => {
          const div = document.createElement('div');
          div.className = 'symbol';
          div.dataset.name = sym.name;
          div.textContent = sym.icon;
          strip.appendChild(div);
        });
        return;
      }
      // Blur effect dengan simbol random
      strip.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        const div = document.createElement('div');
        div.className = 'symbol';
        div.style.opacity = 0.6 + Math.random() * 0.4;
        div.textContent = randomSymbol().icon;
        strip.appendChild(div);
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // Paylines: 5 garis pembayaran
  const PAYLINES = [
    [1,1,1,1,1], // tengah
    [0,0,0,0,0], // atas
    [2,2,2,2,2], // bawah
    [0,1,2,1,0], // V
    [2,1,0,1,2]  // ^
  ];

  function checkWins(result) {
    let totalWin = 0;
    const winningCells = new Set();

    PAYLINES.forEach((line, idx) => {
      const firstSym = result[0][line[0]];
      let count = 1;
      for (let c = 1; c < COLS; c++) {
        if (result[c][line[c]].name === firstSym.name) count++;
        else break;
      }
      if (count >= 3) {
        const win = bet * firstSym.mult * (count - 2) / 2;
        totalWin += win;
        for (let c = 0; c < count; c++) {
          winningCells.add(`${line[c]}-${c}`);
        }
      }
    });

    // Scatter: 3+ 🀄 di mana saja = bonus
    let scatterCount = 0;
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (result[c][r].name === 'Red Dragon') {
          scatterCount++;
          winningCells.add(`${r}-${c}`);
        }
      }
    }
    if (scatterCount >= 3) {
      totalWin += bet * 10 * scatterCount;
    }

    if (totalWin > 0) {
      balance += totalWin;
      updateBalance();
      document.getElementById('winDisplay').textContent = totalWin;
      document.getElementById('message').textContent =
        `🎉 MENANG ${totalWin} KOIN! ${scatterCount >= 3 ? '🀄 SCATTER BONUS!' : ''}`;
      
      // Pemicu Audio Kemenangan
      if (totalWin >= bet * 20) {
        playBigWinAudio();
        coinRain();
      } else {
        playWinAudio();
      }

      // Highlight winning cells
      winningCells.forEach(key => {
        const [r, c] = key.split('-').map(Number);
        const strip = document.getElementById(`strip-${c}`);
        if (strip.children[r]) strip.children[r].classList.add('win');
      });
    } else {
      document.getElementById('message').textContent = 'Coba lagi! 🍀';
    }
  }

  function updateBalance() {
    document.getElementById('balance').textContent = balance;
  }

  function coinRain() {
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        const coin = document.createElement('div');
        coin.className = 'coin-rain';
        coin.textContent = ['🪙','💰','🀄'][Math.floor(Math.random()*3)];
        coin.style.left = Math.random() * 100 + 'vw';
        coin.style.top = '-50px';
        coin.style.animationDuration = (1.5 + Math.random()) + 's';
        document.body.appendChild(coin);
        setTimeout(() => coin.remove(), 2500);
      }, i * 80);
    }
  }
</script>
</body>
</html>
